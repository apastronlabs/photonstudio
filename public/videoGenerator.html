<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="./assets/Logo - Favicon.png">
    <script>
        if (/Mobi|Android/i.test(navigator.userAgent)) {
            window.location.replace("mobile.html" + window.location.search);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photon Studio - AI Video Generation - GPT-Image-2, Nano Banana 2, Veo 3.1, Seedream 5.0, Grok Imagine, Recraft, Reve. Create stunning AI images for free.">
    <meta name="keywords" content="Photon Studio, AI Video Generation, GPT-Image-2, Nano Banana 2, Veo 3.1, Seedream 5.0, Grok Imagine, Recraft, Reve">
    <title>Photon Studio | AI Video Generation</title>
    
    <link rel="prefetch" href="https://app.photonstudio.ai/videoGenerator">
    
    <!-- Fonts and existing CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.css?v=1.0.3">
    
    <link rel="stylesheet" href="./css/videogenerator.css">
</head>
<body>
    <div class="main-container">
        <!-- Section 1 Navbar -->
        <header class="navbar" id="navbar" style="z-index: 10;"></header>
        <div class="navbar-spacer"></div>
        
        <div class="sub-nav">
            <button class="sub-nav-btn">
                <span class="material-icons" style="font-size: 16px;">folder_open</span> History
            </button>
            <button class="sub-nav-btn active">
                <span class="material-icons" style="font-size: 16px;">explore</span> Inspiration
            </button>
        </div>

        <div class="masonry-bg" id="masonry-bg">
            <!-- JS will populate this with images -->
        </div>

        <div class="prompter-box">
            <div class="prompter-top">
                <button class="icon-btn" type="button" aria-label="Add video reference">
                    <span class="material-icons">video_library</span>
                </button>
            </div>
            <textarea class="prompter-input" id="prompter-input" placeholder="Describe the scene you imagine..." rows="2"></textarea>
            <div class="prompter-bottom">
                <div class="model-controls">
                    <div class="model-btn" id="model-name-btn">Veo 3.1</div>
                    <div class="model-btn"><span class="material-icons" style="font-size:14px">diamond</span> 2K</div>
                    <div class="model-btn"><span class="material-icons" style="font-size:14px">grid_4x4</span> 3:4</div>
                </div>
                <button class="generate-btn" id="generate-btn" type="button">
                    Generate <span class="material-icons">movie</span>
                </button>
            </div>
        </div>
        
        <footer class="footer" id="footer"></footer>
    </div>

    <script type="module">
        import { initNavbar } from './js/navbar.js?v=1.0.3';
        import { initTheme } from './js/theme.js?v=1.0.3';
        import { renderFooter } from './js/footer.js?v=1.0.3';
        
        async function init() {
            await initTheme();
            await initNavbar();
            
            const navData = await fetch('./js/nav-data.json?v=1.0.3').then(r => r.json());
            renderFooter(navData);
            
            // Set "Image" tab as active
            setTimeout(() => {
                const navLinks = document.querySelectorAll('.navbar__link');
                navLinks.forEach(link => {
                    if (link.textContent.trim() === 'Video') {
                        link.style.color = 'var(--primary, #FFD600)';
                        link.style.fontWeight = '600';
                    }
                });
            }, 500);

            // Populate masonry with all images from section 4
            const sectionsData = await fetch('./js/sections-data.json?v=1.0.3').then(r => r.json());
            const sec4 = sectionsData.sections.find(s => s.id === 'section-5');
            if (sec4 && sec4.bentoItems) {
                // Get all images
                const images = sec4.bentoItems.map(i => i.imageUrl);
                const masonryBg = document.getElementById('masonry-bg');
                
                // Create 4 columns dynamically based on screen width using CSS grid is easier,
                // but since we want masonry (vertical fill), we can do it via JS columns or CSS multi-column layout.
                // Since we used CSS Grid above, we can just append items and let Grid handle it, 
                // but for true masonry we need columns in JS. Let's stick to the column approach for masonry effect.
                const columnCount = window.innerWidth > 1024 ? 4 : (window.innerWidth > 768 ? 3 : 2);
                
                // Clear grid template and use flex for columns
                masonryBg.style.display = 'flex';
                
                const columns = [];
                for(let i=0; i<columnCount; i++) {
                    const col = document.createElement('div');
                    col.className = 'masonry-column';
                    col.style.flex = '1';
                    masonryBg.appendChild(col);
                    columns.push(col);
                }
                
                images.forEach((imgSrc, index) => {
                    const colIdx = index % columnCount;
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    
                    let mediaHtml = '';
                    if (imgSrc.toLowerCase().includes('.mp4')) {
                        mediaHtml = `<video src="${imgSrc}" autoplay loop muted playsinline disablepictureinpicture style="width: 100%; display: block; object-fit: cover;"></video>`;
                    } else {
                        mediaHtml = `<img src="${imgSrc}" loading="lazy" alt="Generated Image">`;
                    }
                    
                    card.innerHTML = `
                        ${mediaHtml}
                        <button class="recreate-btn">Recreate <span class="material-icons" style="font-size:14px">north_east</span></button>
                    `;
                    columns[colIdx].appendChild(card);
                });
            }

            // Page Parameter
            const urlParams = new URLSearchParams(window.location.search);
            const modelParam = urlParams.get('model');
            if (modelParam) {
                document.getElementById('model-name-btn').textContent = modelParam;
            }

            // Navigate to login only when clicking Generate (or Recreate on cards)
            const generateBtn = document.getElementById('generate-btn');
            const prompterInput = document.getElementById('prompter-input');

            function navigateToLogin() {
                window.location.href = 'https://app.photonstudio.ai/login';
            }

            if (generateBtn) {
                generateBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navigateToLogin();
                });
            }

            if (prompterInput) {
                prompterInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        navigateToLogin();
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (e.target.closest('.recreate-btn')) {
                    e.preventDefault();
                    navigateToLogin();
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', init);
        
        // Register Service Worker for caching media
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('Service Worker registered successfully:', reg.scope))
              .catch(err => console.error('Service Worker registration failed:', err));
          });
        }
    </script>

    <!-- Hidden Preload Modal -->
    <script>
        (function() {
            const loadPreloadIframe = () => {
                if (document.getElementById('photon-preload-modal')) return;
                const iframe = document.createElement('iframe');
                iframe.src = "https://app.photonstudio.ai/login";
                iframe.id = 'photon-preload-modal';
                iframe.style.position = 'fixed';
                iframe.style.top = '50%';
                iframe.style.left = '50%';
                iframe.style.transform = 'translate(-50%, -50%)';
                iframe.style.width = '60vw';
                iframe.style.height = '80vh';
                iframe.style.border = 'none';
                iframe.style.borderRadius = '16px';
                iframe.style.display = 'none'; // Hidden modal
                document.body.appendChild(iframe);
            };
            if (document.readyState === 'complete') {
                setTimeout(loadPreloadIframe, 100);
            } else {
                window.addEventListener('load', () => setTimeout(loadPreloadIframe, 100));
            }
        })();
    </script>
</body>
</html>
